<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Travel Agent Toolkit</title>
    <!--
      GitHub Pages has no server-side rewrite support, so a direct load or
      refresh of a client-side route (e.g. /Travel-Agent-Toolkit/tools/quotation)
      is served this 404.html by GitHub's static host. This script encodes the
      requested path into a query string and redirects to the app's index.html,
      which restores the real path before React Router mounts (see the inline
      script in index.html). This keeps BrowserRouter working without switching
      to HashRouter. Based on the widely-used spa-github-pages technique.
    -->
    <script>
      var pathSegmentsToKeep = 1; // keeps "/Travel-Agent-Toolkit"
      var l = window.location;
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
        l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") + "/?/" +
        l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
        (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
